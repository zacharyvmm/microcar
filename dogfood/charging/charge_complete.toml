# charge_complete — SOC reaches EVSE target (80%), charging completes
#
# Tests completion pathway (Stage E):
# 1. EVSE plug → handshake → charging ACTIVE at 32A
# 2. Plant sensor data shows SOC rising through 75% → 78% → 80%
# 3. BMS publishes charge limit with SOC=80 (== target)
# 4. Gateway FSM: DISCONNECTED → PLUG_DETECTED → HANDSHAKE → ACTIVE → COMPLETE
# 5. Gateway CHARGE_COMMAND current drops to 0
# 6. Vehicle stays in CHARGING mode (completion != fault)

name = "charge_complete"
duration_ms = 4000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

# EVSE as passive external actor (no firmware, bus_inject only)
[[machine]]
id = 6
name = "evse"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "evse"

# ── Plant: SOC=75%, temp=25°C ──
[[bus_inject]]
at_ms = 150
bus = "vcan0"
sender = "plant"
id = 0x500
data = [75, 1, 104, 0, 250, 0, 100]

# ── EVSE: PLUG event (0x610): target SOC=80 ──
[[bus_inject]]
at_ms = 200
bus = "vcan0"
sender = "evse"
id = 0x610
data = [6, 1, 1, 64, 80, 0]

# ── EVSE: HANDSHAKE_OK event ──
[[bus_inject]]
at_ms = 300
bus = "vcan0"
sender = "evse"
id = 0x610
data = [6, 2, 1, 64, 80, 0]

# ── BMS: charge limit at 75% SOC ──
[[bus_inject]]
at_ms = 350
bus = "vcan0"
sender = "bms"
id = 0x203
data = [3, 64, 75, 0, 250, 0, 1]

# ── Plant: SOC rising to 78%, temp slightly up ──
[[bus_inject]]
at_ms = 1500
bus = "vcan0"
sender = "plant"
id = 0x500
data = [78, 1, 104, 0, 255, 0, 80]

# ── BMS: charge limit at 78% SOC ──
[[bus_inject]]
at_ms = 1550
bus = "vcan0"
sender = "bms"
id = 0x203
data = [3, 64, 78, 0, 255, 0, 2]

# ── Plant: SOC hits 80% (target reached) ──
[[bus_inject]]
at_ms = 3000
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 108, 1, 4, 0, 60]

# ── BMS: charge limit SOC=80% == target → gateway transitions to COMPLETE ──
# temp=26°C=260 → LE [4, 1]
[[bus_inject]]
at_ms = 3050
bus = "vcan0"
sender = "bms"
id = 0x203
data = [3, 64, 80, 4, 1, 0, 3]

# ── Assertions ────────────────────────────────────────────────────────────

[[expect.event]]
before_ms = 1000
machine = "gateway"
event = "vehicle_mode"
value = "CHARGING"

[[expect.event]]
before_ms = 3500
machine = "gateway"
event = "vehicle_mode"
value = "CHARGING"

[[expect.event]]
before_ms = 3500
machine = "powertrain"
event = "motor_command"
torque = 0

[plant]
type = "microcar"
tick_ms = 10
