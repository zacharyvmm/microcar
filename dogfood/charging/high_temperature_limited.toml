# high_temperature_limited — BMS temp > 45°C, current limits from 32A to 16A
#
# Tests thermal limit pathway (Stage E):
# 1. EVSE plug → handshake → charging ACTIVE at 32A (25°C)
# 2. BMS temp rises to 46°C (> 45°C threshold)
# 3. BMS publishes lowered charge limit (16A)
# 4. Gateway FSM: DISCONNECTED → PLUG_DETECTED → HANDSHAKE → ACTIVE → LIMITED
# 5. Gateway CHARGE_COMMAND current drops from 32A → 16A
# 6. Vehicle stays in CHARGING mode, powertrain torque stays zero

name = "high_temperature_limited"
duration_ms = 3500

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

# EVSE as passive external actor (no firmware, bus_inject only)
[[machine]]
id = 6
name = "evse"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "evse"

# ── Plant: normal temp 25°C, SOC=80% ──
[[bus_inject]]
at_ms = 150
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 104, 0, 250, 0, 100]

# ── EVSE: PLUG event (0x610) ──
[[bus_inject]]
at_ms = 200
bus = "vcan0"
sender = "evse"
id = 0x610
data = [6, 1, 1, 64, 80, 0]

# ── EVSE: HANDSHAKE_OK event ──
[[bus_inject]]
at_ms = 300
bus = "vcan0"
sender = "evse"
id = 0x610
data = [6, 2, 1, 64, 80, 0]

# ── BMS: charge limit normal (25°C → 32A) ──
# payload: [source=3, max_current=64(32A), soc=80, temp=250(25°C), fault=0, seq=1]
[[bus_inject]]
at_ms = 350
bus = "vcan0"
sender = "bms"
id = 0x203
data = [3, 64, 80, 0, 250, 0, 1]

# ── Plant: temp rises to 46°C (>45°C threshold) ──
# temp=46°C → temp_c_x10=460 → 0x01CC → [1, 204]
[[bus_inject]]
at_ms = 2000
bus = "vcan0"
sender = "plant"
id = 0x500
data = [81, 1, 104, 1, 204, 0, 100]

# ── BMS: lowered charge limit (46°C → 16A) ──
# payload: [source=3, max_current=32(16A), soc=81, temp=460(46°C), fault=0, seq=2]
# temp 460 = 0x01CC → LE i16 → bytes [204, 1]
[[bus_inject]]
at_ms = 2050
bus = "vcan0"
sender = "bms"
id = 0x203
data = [3, 32, 81, 204, 1, 0, 2]

# ── Assertions ────────────────────────────────────────────────────────────

[[expect.event]]
before_ms = 1000
machine = "gateway"
event = "vehicle_mode"
value = "CHARGING"

[[expect.event]]
before_ms = 3000
machine = "gateway"
event = "vehicle_mode"
value = "CHARGING"

[[expect.event]]
before_ms = 3000
machine = "powertrain"
event = "motor_command"
torque = 0

[plant]
type = "microcar"
tick_ms = 10
