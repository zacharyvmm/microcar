# bms_fault_stops_charging — BMS critical fault during charging, zero current
#
# Tests fault-stop pathway (Stage E):
# 1. EVSE plug → handshake → charging ACTIVE at 32A
# 2. BMS detects a critical fault and publishes charge limit with fault=1, max=0
# 3. Gateway FSM: DISCONNECTED → PLUG_DETECTED → HANDSHAKE → ACTIVE → FAULT
# 4. Gateway CHARGE_COMMAND current drops to zero, state=FAULT
# 5. Vehicle mode transitions from CHARGING to FAULT
# 6. Powertrain torque stays zero

name = "bms_fault_stops_charging"
duration_ms = 2500

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

# EVSE as passive external actor (no firmware, bus_inject only)
[[machine]]
id = 6
name = "evse"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "evse"

# ── Plant: normal temp 25°C, SOC=80% ──
[[bus_inject]]
at_ms = 150
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 104, 0, 250, 0, 100]

# ── EVSE: PLUG event (0x610) ──
[[bus_inject]]
at_ms = 200
bus = "vcan0"
sender = "evse"
id = 0x610
data = [6, 1, 1, 64, 80, 0]

# ── EVSE: HANDSHAKE_OK event ──
[[bus_inject]]
at_ms = 300
bus = "vcan0"
sender = "evse"
id = 0x610
data = [6, 2, 1, 64, 80, 0]

# ── BMS: normal charge limit (32A, no fault) ──
[[bus_inject]]
at_ms = 350
bus = "vcan0"
sender = "bms"
id = 0x203
data = [3, 64, 80, 0, 250, 0, 1]

# ── BMS: critical fault — max_current=0, fault=1 ──
# Gateway FSM: ACTIVE → FAULT (any plugged state + critical fault)
[[bus_inject]]
at_ms = 1500
bus = "vcan0"
sender = "bms"
id = 0x203
data = [3, 0, 80, 0, 250, 1, 2]

# ── Assertions ────────────────────────────────────────────────────────────

[[expect.event]]
before_ms = 1000
machine = "gateway"
event = "vehicle_mode"
value = "CHARGING"

[[expect.event]]
before_ms = 2200
machine = "gateway"
event = "vehicle_mode"
value = "FAULT"

[[expect.event]]
before_ms = 2200
machine = "powertrain"
event = "motor_command"
torque = 0

[plant]
type = "microcar"
tick_ms = 10
