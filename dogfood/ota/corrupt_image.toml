# corrupt_image — OTA image with bad CRC; gateway rejects at verification
#
# Full OTA flow proceeds normally through chunk delivery, but OTA_FINISH
# carries a deliberately incorrect CRC. The gateway verifies the image,
# detects the mismatch, and rejects the update without committing.
# Slot A remains the active slot.

name = "ota_corrupt_image"
duration_ms = 5000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

[[machine]]
id = 7
name = "ota_tool"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "ota_tool"

# ── Boot to READY ──
[[bus_inject]]
at_ms = 50
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 50]

[[bus_inject]]
at_ms = 70
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 70]

[[bus_inject]]
at_ms = 80
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 80]

[[bus_inject]]
at_ms = 150
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 150]

[[bus_inject]]
at_ms = 170
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 170]

[[bus_inject]]
at_ms = 180
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 180]

# ── Plant data ──
[[bus_inject]]
at_ms = 200
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 104, 0, 250, 0, 100]

# ── OTA_REQUEST: request_id=1, version=2, total_chunks=3 ──
[[bus_inject]]
at_ms = 500
bus = "vcan0"
sender = "ota_tool"
id = 0x630
data = [7, 1, 2, 3]

# ── OTA_CHUNK 0 ──
[[bus_inject]]
at_ms = 600
bus = "vcan0"
sender = "ota_tool"
id = 0x631
data = [7, 1, 0, 160, 161, 162, 163, 164]

# ── OTA_CHUNK 1 ──
[[bus_inject]]
at_ms = 700
bus = "vcan0"
sender = "ota_tool"
id = 0x631
data = [7, 1, 1, 165, 166, 167, 168, 169]

# ── OTA_CHUNK 2 ──
[[bus_inject]]
at_ms = 800
bus = "vcan0"
sender = "ota_tool"
id = 0x631
data = [7, 1, 2, 170, 171, 172, 173, 174]

# ── OTA_FINISH with WRONG CRC — gateway must reject ──
# CRC=0xBAADC0DE (deliberately corrupt, not matching chunks above)
[[bus_inject]]
at_ms = 900
bus = "vcan0"
sender = "ota_tool"
id = 0x632
data = [7, 1, 3, 222, 192, 173, 186]

# ── Gateway publishes OTA_STATUS: RolledBack (state=6), slot A still active ──
[[bus_inject]]
at_ms = 1200
bus = "vcan0"
sender = "gateway"
id = 0x633
data = [1, 1, 6, 0, 0, 0]  # source=1, req=1, state=RolledBack(6), slot=A(0)

[plant]
type = "microcar"
tick_ms = 10
