# ota_rejected_drive — OTA request while DRIVE mode; gateway rejects
#
# The vehicle is in DRIVE mode (moving). The ota_tool sends an
# OTA_REQUEST frame. The gateway must reject the update because
# firmware updates are not permitted while the vehicle is being
# driven — this is a safety gate. The gateway responds with an
# OTA_STATUS rejection. Slot A remains active.

name = "ota_rejected_drive"
duration_ms = 5000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

[[machine]]
id = 7
name = "ota_tool"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "ota_tool"

# ── Boot to READY ──
[[bus_inject]]
at_ms = 50
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 50]

[[bus_inject]]
at_ms = 70
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 70]

[[bus_inject]]
at_ms = 80
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 80]

[[bus_inject]]
at_ms = 150
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 150]

[[bus_inject]]
at_ms = 170
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 170]

[[bus_inject]]
at_ms = 180
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 180]

# ── Transition to DRIVE mode ──
# Driver input: throttle=30%, brake=0, gear=Drive(2)
[[bus_inject]]
at_ms = 250
bus = "vcan0"
sender = "gateway"
id = 0x020
data = [1, 30, 0, 2]

# Gateway confirms DRIVE mode
[[bus_inject]]
at_ms = 300
bus = "vcan0"
sender = "gateway"
id = 0x010
data = [1, 2, 0]  # source=1, mode=DRIVE(2), fault_code=0

# ── Plant data ──
[[bus_inject]]
at_ms = 350
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 104, 0, 250, 0, 100]

# ── OTA_REQUEST while in DRIVE — gateway MUST reject ──
[[bus_inject]]
at_ms = 500
bus = "vcan0"
sender = "ota_tool"
id = 0x630
data = [7, 1, 2, 4]

# ── Gateway responds with OTA_STATUS: rejected (state=Idle(0), reason=DRIVE mode) ──
[[bus_inject]]
at_ms = 600
bus = "vcan0"
sender = "gateway"
id = 0x633
data = [1, 1, 0, 0, 2, 0]  # source=1, req=1, state=Idle(0), slot=A(0), reason=DRIVE(2)

# ── Assertions ──

# Gateway must NOT enter Downloading state.
[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "ota_state:Downloading"

[plant]
type = "microcar"
tick_ms = 10
