# ota_rejected_charging — OTA request while charging; gateway rejects
#
# The vehicle is in CHARGING mode (connected to EVSE, actively charging).
# The ota_tool sends an OTA_REQUEST frame. The gateway must reject the
# update because firmware updates are not permitted during active
# charging — interrupting the charge session could damage the battery
# or create a safety hazard. Slot A remains active.

name = "ota_rejected_charging"
duration_ms = 5000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

[[machine]]
id = 7
name = "ota_tool"

# EVSE as passive external actor for charging handshake
[[machine]]
id = 6
name = "evse"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "ota_tool"

[[bus.node]]
bus = "vcan0"
machine = "evse"

# ── Boot to READY ──
[[bus_inject]]
at_ms = 50
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 50]

[[bus_inject]]
at_ms = 70
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 70]

[[bus_inject]]
at_ms = 80
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 80]

[[bus_inject]]
at_ms = 150
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 150]

[[bus_inject]]
at_ms = 170
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 170]

[[bus_inject]]
at_ms = 180
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 180]

# ── Plant data ──
[[bus_inject]]
at_ms = 200
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 104, 0, 250, 0, 100]

# ── EVSE plug detected → charging handshake ──
[[bus_inject]]
at_ms = 250
bus = "vcan0"
sender = "evse"
id = 0x610
data = [6, 1, 1, 64, 80, 0]  # source=6, event=PLUG(1), req=1, current=64(32A), soc=80

# ── EVSE handshake OK ──
[[bus_inject]]
at_ms = 300
bus = "vcan0"
sender = "evse"
id = 0x610
data = [6, 2, 1, 64, 80, 0]  # event=HANDSHAKE_OK(2)

# ── BMS publishes charge limit ──
[[bus_inject]]
at_ms = 350
bus = "vcan0"
sender = "bms"
id = 0x203
data = [3, 64, 80, 0, 250, 0, 1]  # max_current=64(32A), soc=80, temp=25°C

# ── Gateway transitions to CHARGING mode ──
[[bus_inject]]
at_ms = 400
bus = "vcan0"
sender = "gateway"
id = 0x010
data = [1, 5, 0]  # source=1, mode=CHARGING(5), fault_code=0

# ── OTA_REQUEST while in CHARGING — gateway MUST reject ──
[[bus_inject]]
at_ms = 500
bus = "vcan0"
sender = "ota_tool"
id = 0x630
data = [7, 1, 2, 4]

# ── Gateway responds with OTA_STATUS: rejected (state=Idle(0), reason=CHARGING) ──
[[bus_inject]]
at_ms = 600
bus = "vcan0"
sender = "gateway"
id = 0x633
data = [1, 1, 0, 0, 5, 0]  # source=1, req=1, state=Idle(0), slot=A(0), reason=CHARGING(5)

# ── Assertions ──

# Gateway must NOT enter Downloading state.
[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "ota_state:Downloading"

[plant]
type = "microcar"
tick_ms = 10
