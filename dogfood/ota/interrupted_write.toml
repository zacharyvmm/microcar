# interrupted_write — missing chunk via bus fault; gateway detects incomplete
#
# OTA_REQUEST declares total_chunks=3. Chunks 0 and 2 are delivered normally,
# but chunk 1 is dropped by a bus fault (drop_frame on 0x631). When OTA_FINISH
# arrives, the gateway has only received 2 of 3 chunks and detects the
# incomplete write. The update is rejected without committing to slot B.

name = "ota_interrupted_write"
duration_ms = 5000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

[[machine]]
id = 7
name = "ota_tool"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "ota_tool"

# ── Boot to READY ──
[[bus_inject]]
at_ms = 50
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 50]

[[bus_inject]]
at_ms = 70
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 70]

[[bus_inject]]
at_ms = 80
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 80]

[[bus_inject]]
at_ms = 150
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 150]

[[bus_inject]]
at_ms = 170
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 170]

[[bus_inject]]
at_ms = 180
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 180]

# ── Plant data ──
[[bus_inject]]
at_ms = 200
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 104, 0, 250, 0, 100]

# ── OTA_REQUEST: total_chunks=3 ──
[[bus_inject]]
at_ms = 500
bus = "vcan0"
sender = "ota_tool"
id = 0x630
data = [7, 1, 2, 3]

# ── Chunk 0 delivered ──
[[bus_inject]]
at_ms = 600
bus = "vcan0"
sender = "ota_tool"
id = 0x631
data = [7, 1, 0, 160, 161, 162, 163, 164]

# ── BUS FAULT: drop OTA_CHUNK (0x631) — chunk 1 is lost ──
[[fault]]
at_ms = 650
target = "bus.vcan0"
type = "drop_frame"
id = 0x631

# Chunk 1 is injected at 700ms but dropped by the bus fault.
[[bus_inject]]
at_ms = 700
bus = "vcan0"
sender = "ota_tool"
id = 0x631
data = [7, 1, 1, 165, 166, 167, 168, 169]

# ── Chunk 2 delivered (fault may still be active, but this is chunk_idx=2 not 1) ──
[[bus_inject]]
at_ms = 900
bus = "vcan0"
sender = "ota_tool"
id = 0x631
data = [7, 1, 2, 170, 171, 172, 173, 174]

# ── OTA_FINISH: total=3, but gateway only saw chunks 0 and 2 (missing 1) ──
[[bus_inject]]
at_ms = 1000
bus = "vcan0"
sender = "ota_tool"
id = 0x632
data = [7, 1, 3, 239, 190, 173, 222]

# ── Gateway detects incomplete write and rejects ──
[[bus_inject]]
at_ms = 1200
bus = "vcan0"
sender = "gateway"
id = 0x633
data = [1, 1, 6, 0, 0, 0]  # state=RolledBack(6), slot=A(0)

[plant]
type = "microcar"
tick_ms = 10
