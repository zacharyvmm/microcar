# power_cut_before_commit — reboot before commit; slot A still active
#
# The OTA image is fully downloaded and verified (valid CRC), but before
# the gateway can commit the new image to slot B, a power cut / reboot
# occurs. After reboot, the gateway finds no valid commit record for
# slot B and continues running from slot A. The update is lost but the
# vehicle remains operational.

name = "ota_power_cut_before_commit"
duration_ms = 8000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

[[machine]]
id = 7
name = "ota_tool"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "ota_tool"

# ── Boot to READY ──
[[bus_inject]]
at_ms = 50
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 50]

[[bus_inject]]
at_ms = 70
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 70]

[[bus_inject]]
at_ms = 80
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 80]

[[bus_inject]]
at_ms = 150
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 150]

[[bus_inject]]
at_ms = 170
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 170]

[[bus_inject]]
at_ms = 180
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 180]

# ── Plant data ──
[[bus_inject]]
at_ms = 200
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 104, 0, 250, 0, 100]

# ── OTA_REQUEST: total_chunks=3 ──
[[bus_inject]]
at_ms = 500
bus = "vcan0"
sender = "ota_tool"
id = 0x630
data = [7, 1, 2, 3]

# ── All chunks delivered ──
[[bus_inject]]
at_ms = 600
bus = "vcan0"
sender = "ota_tool"
id = 0x631
data = [7, 1, 0, 160, 161, 162, 163, 164]

[[bus_inject]]
at_ms = 700
bus = "vcan0"
sender = "ota_tool"
id = 0x631
data = [7, 1, 1, 165, 166, 167, 168, 169]

[[bus_inject]]
at_ms = 800
bus = "vcan0"
sender = "ota_tool"
id = 0x631
data = [7, 1, 2, 170, 171, 172, 173, 174]

# ── OTA_FINISH with valid CRC — gateway begins verification ──
[[bus_inject]]
at_ms = 900
bus = "vcan0"
sender = "ota_tool"
id = 0x632
data = [7, 1, 3, 239, 190, 173, 222]

# ── POWER CUT: gateway reboots BEFORE commit completes ──
# The reboot destroys the in-progress commit; no metadata record is written.
[[fault]]
at_ms = 950
target = "machine.gateway"
type = "reboot"
downtime_ms = 20

# ── Gateway reboots — still on slot A, OTA state is Idle ──
[[bus_inject]]
at_ms = 1100
bus = "vcan0"
sender = "gateway"
id = 0x001
data = [1, 0, 0, 0, 100]

[[bus_inject]]
at_ms = 1200
bus = "vcan0"
sender = "powertrain"
id = 0x001
data = [2, 0, 0, 0, 100]

[[bus_inject]]
at_ms = 1300
bus = "vcan0"
sender = "bms"
id = 0x001
data = [3, 0, 0, 0, 100]

# ── Assertions ──

# Gateway must experience a reset (power cut).
[[expect.event]]
before_ms = 2000
machine = "gateway"
event = "machine_reset_begin"

# Gateway must boot after power cut.
[[expect.event]]
before_ms = 2500
machine = "gateway"
event = "machine_reset_boot"

# Gateway must NOT commit to slot B — OTA state should be Idle or RolledBack.
[[expect.no]]
before_ms = 5000
machine = "gateway"
event = "ota_state:Healthy"

[plant]
type = "microcar"
tick_ms = 10
