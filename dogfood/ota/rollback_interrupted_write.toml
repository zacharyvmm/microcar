# rollback_interrupted_write — a power cut during the image write rolls back.
#
# OTA fault-matrix case (the plan's "power cut before/during write"). Uses the
# `gateway_ota_intwrite` dogfood firmware variant, which drives the OTA
# slot-metadata model (common/src/microcar_ota_slot.c) with an interrupted
# download: the partial image is discarded and the update aborts back to the
# known-good slot A before it ever verifies:
#   IDLE(0) → DOWNLOADING(1) → ROLLED_BACK(6, slot A).
#
# The lane asserts the update never armed a partial image: the state sequence
# reaches ROLLED_BACK without verifying, a rollback occurred, and the active/boot
# slot stayed at slot A (0).
#
# ota-expect: state-sequence 0,1,6
# ota-expect: rolled-back
# ota-expect: active-slot 0

name = "ota_rollback_interrupted_write"
duration_ms = 1000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ota_intwrite"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

[[machine]]
id = 4
name = "dashboard"
firmware = "firmware/dashboard_ecu"
rtos = "freertos"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "dashboard"

[plant]
type = "microcar"
tick_ms = 10
