# rollback_powercut_precommit — a power cut before the atomic commit reverts.
#
# OTA fault-matrix case (the plan's "power cut after write before commit"). Uses
# the `gateway_ota_powercut` dogfood firmware variant, which drives the OTA
# slot-metadata model (common/src/microcar_ota_slot.c) through a *valid*
# download and verify — then a power cut strikes before the atomic commit, so
# the verified-but-uncommitted image is discarded and the bootloader stays on
# the known-good slot A:
#   IDLE(0) → DOWNLOADING(1) → VERIFYING(2, crc ok) → ROLLED_BACK(6, slot A).
#
# This proves the commit is the point of no return: even a perfectly valid image
# does NOT take effect if power is lost before it commits — the vehicle keeps
# running its previous firmware. The distinguishing marker vs the bad-CRC case
# is `crc-ok` (the image was valid) despite the rollback.
#
# ota-expect: state-sequence 0,1,2,6
# ota-expect: crc-ok
# ota-expect: rolled-back
# ota-expect: active-slot 0

name = "ota_rollback_powercut_precommit"
duration_ms = 1000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ota_powercut"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

[[machine]]
id = 4
name = "dashboard"
firmware = "firmware/dashboard_ecu"
rtos = "freertos"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "dashboard"

[plant]
type = "microcar"
tick_ms = 10
