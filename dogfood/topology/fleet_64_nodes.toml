# fleet_64_nodes — bus isolation at scale: 64 machines across 8 CAN buses
# with the gateway as the only shared (multi-interface) hub node.
#
#   vcan0: gateway(1), node_2, node_3, node_4, node_5, node_6, node_7, node_8, node_9
#   vcan1: gateway(1), node_10, node_11, node_12, node_13, node_14, node_15, node_16, node_17
#   vcan2: gateway(1), node_18, node_19, node_20, node_21, node_22, node_23, node_24, node_25
#   vcan3: gateway(1), node_26, node_27, node_28, node_29, node_30, node_31, node_32, node_33
#   vcan4: gateway(1), node_34, node_35, node_36, node_37, node_38, node_39, node_40, node_41
#   vcan5: gateway(1), node_42, node_43, node_44, node_45, node_46, node_47, node_48, node_49
#   vcan6: gateway(1), node_50, node_51, node_52, node_53, node_54, node_55, node_56, node_57
#   vcan7: gateway(1), node_58, node_59, node_60, node_61, node_62, node_63, node_64
#
# A probe on any bus must reach exactly that bus's other nodes (the gateway
# included, since it is on every bus) and no node on any other bus.
#
# topology-probe: probe=0x0740 expect=1,3,4,5,6,7,8,9
# topology-probe: probe=0x0743 expect=1,27,28,29,30,31,32,33
# topology-probe: probe=0x0747 expect=1,59,60,61,62,63,64
