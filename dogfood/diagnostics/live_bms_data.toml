# live_bms_data — plant → BMS → gateway → diagnostics tool over CAN
#
# Tests the real diagnostics path (Stage D):
# 1. Plant publishes sensor data on 0x500
# 2. BMS reads it and publishes BMS_STATUS (0x200) with sequence
# 3. Gateway caches the BMS snapshot
# 4. Diagnostics tool queries MC_DIAG_LIVE_BMS (0x600)
# 5. Gateway responds with decoded values (0x601)
# 6. Tool assembles a complete snapshot

name = "live_bms_data"
duration_ms = 3000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

[[machine]]
id = 5
name = "diag_tool"
firmware = "firmware/diagnostics_tool_ecu"
rtos = "freertos"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "diag_tool"

# ── Plant sensor data: SOC=80%, voltage=360V, temp=25°C, current=10A ──
# 0x500 payload: [soc(80), volt_hi(1, 104), temp_hi(0, 250), current_hi(0, 100)]
# voltage = 360V = 0x0168 → [0x01, 0x68]
# temp = 25°C x10 = 250 = 0x00FA → [0x00, 0xFA]
# current = 10A x1000 = 10000mA → but i16 range, use 100 = 0x0064 → [0x00, 0x64]

[[bus_inject]]
at_ms = 100
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 104, 0, 250, 0, 100]

[[bus_inject]]
at_ms = 200
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 104, 0, 251, 0, 100]

[[bus_inject]]
at_ms = 300
bus = "vcan0"
sender = "plant"
id = 0x500
data = [80, 1, 104, 0, 252, 0, 100]

# ── Diagnostics tool queries LIVE_BMS with selector 0 ──
[[bus_inject]]
at_ms = 500
bus = "vcan0"
sender = "diag_tool"
id = 0x600
data = [5, 5, 1, 0]  # source=DIAGNOSTICS, service=LIVE_BMS=5, request_id=1, param=0

[[bus_inject]]
at_ms = 600
bus = "vcan0"
sender = "diag_tool"
id = 0x600
data = [5, 5, 2, 1]  # param=1 (voltage)

[[bus_inject]]
at_ms = 700
bus = "vcan0"
sender = "diag_tool"
id = 0x600
data = [5, 5, 3, 2]  # param=2 (current)

# ── Keep BMS receiving plant data ──
[[bus_inject]]
at_ms = 800
bus = "vcan0"
sender = "plant"
id = 0x500
data = [82, 1, 108, 0, 255, 0, 80]

[plant]
type = "microcar"
tick_ms = 10
