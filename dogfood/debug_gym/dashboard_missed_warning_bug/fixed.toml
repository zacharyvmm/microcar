# dashboard_missed_warning_bug/fixed.toml
#
# Fix: the dashboard renderer properly prioritises critical warnings so
# a normal vehicle-mode repaint cannot overwrite an active fault screen.
# After the gateway transitions FAULT → DRIVE (brief BMS fault that
# self-clears), the fixed display-update task keeps the FAULT warning
# visible until the driver explicitly acknowledges it.
#
# Identical plant stimuli as failing.toml: battery temperature spikes to
# 95 °C at 1000 ms, then drops back to 25 °C at 1010 ms.  The gateway
# transitions FAULT → DRIVE within ~10 ms, but the fixed dashboard
# firmware retains the critical-warning screen.
#
# Localizing evidence: dashboard warning plus framebuffer hash.
# The fixed firmware paints the FAULT red screen; the framebuffer hash
# will be 0x7800 (VEHICLE_FAULT bg_color), NOT 0x0200 (VEHICLE_DRIVE).

name = "dashboard_missed_warning_bug"
duration_ms = 3000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[machine]]
id = 3
name = "bms"
firmware = "firmware/bms_ecu"
rtos = "freertos"

[[machine]]
id = 4
name = "dashboard"
firmware = "firmware/dashboard_warning_fixed"
rtos = "freertos"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

[[bus.node]]
bus = "vcan0"
machine = "bms"

[[bus.node]]
bus = "vcan0"
machine = "dashboard"

[plant]
type = "microcar"
tick_ms = 10

# ── Driver applies 40 % throttle to enter DRIVE ──
[[input]]
at_ms = 100
type = "driver_input"
throttle_percent = 40
brake_pressed = false

# ── Trigger FAULT: force battery to 95 °C ──
[[fault]]
at_ms = 1000
target = "plant.battery"
type = "force_temperature"
value_c = 95

# ── Clear the fault 10 ms later ──
[[fault]]
at_ms = 1010
target = "plant.battery"
type = "force_temperature"
value_c = 25

# ── Assertions ────────────────────────────────────────────────────────

# The BMS detects the overtemp and raises a fault.
[[expect.event]]
before_ms = 1100
machine = "bms"
event = "fault"
value = "CRITICAL_BMS_FAULT"

# The gateway transitions to FAULT mode.
[[expect.event]]
before_ms = 1200
machine = "gateway"
event = "vehicle_mode"
value = "FAULT"

# The dashboard receives the warning from the gateway.
[[expect.event]]
before_ms = 1300
machine = "dashboard"
event = "warning"
value = "CRITICAL_BMS_FAULT"

# BUG FIXED: the fixed display_update task retains the critical warning
# even after the fault clears and the gateway returns to DRIVE.  The
# periodic display_update trace still reports the CRITICAL_BMS_FAULT
# warning code (7).
[[expect.event]]
before_ms = 2000
machine = "dashboard"
event = "display_update"
value = 7
