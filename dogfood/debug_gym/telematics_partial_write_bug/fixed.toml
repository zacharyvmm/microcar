# telematics_partial_write_bug (fixed) — parser buffers and reassembles
#
# Debug-gym seed: a 15-byte TELEM_REC_STATUS record is split across two
# Ethernet fragments at byte 7. The correct parser buffers the first
# (incomplete) fragment and, when the remainder arrives, reassembles and
# correctly decodes the complete record.
#
# This is the *fixed* half of the pair.  The failing half is failing.toml.
#
# Record format (microcar_telematics.h):
#   [2-byte BE length][1-byte type][4-byte uptime_ms][4-byte send_count][4-byte recv_count]
#
# Complete record (15 bytes):
#   00 0D 01 00 00 00 01 00 00 00 64 00 00 00 00
#   └─len=13─┘ └type=1┘ └─uptime=1──┘ └send=100──┘ └recv=0───┘
#
# Fragment 1 (7 bytes): 00 0D 01 00 00 00 01  — truncates inside uptime_ms
# Fragment 2 (8 bytes): 00 00 00 64 00 00 00 00  — remainder + payload
#
# The correct parser:
#   1. Receives 7 bytes — reads length=13, needs 15 total → buffers all 7.
#   2. Receives 8 more bytes — now has 15 → assembles and decodes correctly.

name = "telematics_partial_write_bug_fixed"
duration_ms = 5000

[[machine]]
id = 1
name = "injector"
# Dummy machine — link endpoint for fragment injection.

[[machine]]
id = 2
name = "parser"
firmware = "firmware/telematics_ecu"
rtos = "freertos"

[[link]]
type = "eth"
from = 1
to = 2
latency = 1000

[plant]
type = "microcar"
tick_ms = 10

# Fragment 1 arrives at 100 ms virtual time.
# The correct parser receives 7 bytes, sees length=13, buffers them.
[[inject]]
at = 100000
link = { from = 1, to = 2 }
data = "\u0000\u000D\u0001\u0000\u0000\u0000\u0001"

# Fragment 2 arrives at 200 ms virtual time.
# The correct parser appends these 8 bytes to the buffer (now 15 total),
# decodes: type=STATUS, uptime_ms=1, send_count=100, recv_count=0.
[[inject]]
at = 200000
link = { from = 1, to = 2 }
data = "\u0000\u0000\u0000\u0064\u0000\u0000\u0000\u0000"
