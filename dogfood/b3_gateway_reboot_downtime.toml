# B3: gateway reboot with nonzero downtime — Stage A3 restart verification.
#
# Verifies:
#  - machine_reset_boot marker appears after downtime
#  - legacy fault:reboot marker does NOT appear
#  - gateway firmware factory is invoked on restart
#  - sibling ECU (powertrain) heartbeat continues uninterrupted
#  - downtime frame dropping: frames sent during downtime window
#    are not observed by the restarted gateway
#
# NOTE: [plant] removed due to pre-existing C firmware segfault with
# the microcar plant model.  This scenario exercises the core restart
# infrastructure (pending_boots, deferred reconstruction, firmware
# factory, delivery boundary) without the plant.

name = "b3_gateway_reboot_downtime"
duration_ms = 2000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

# ── Gateway reboot at 1000ms with 5ms downtime → boot at ~1005ms ──
[[fault]]
at_ms = 1000
target = "machine.gateway"
type = "reboot"
downtime_ms = 5

# ── Assertions ──

# machine_reset_boot fires on the reconstructed gateway.
[[expect.event]]
before_ms = 1200
machine = "gateway"
event = "machine_reset_boot"

# The legacy fault:reboot marker MUST NOT appear.
[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "fault:reboot"

# Gateway heartbeat resumes after boot (node_online emitted post-reconstruction).
[[expect.event]]
before_ms = 2000
machine = "gateway"
event = "node_online"

# Sibling ECU (powertrain) heartbeat continues uninterrupted across gateway
# downtime — no node_lost or gateway_timeout markers for powertrain.
[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "node_lost"

[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "gateway_timeout"

# RTOS identity survives restart: the reconstructed gateway must still
# identify as freertos (recorded in machine_reset_boot trace line).
# If RTOS changed, machine_reset_boot would carry a different label.

