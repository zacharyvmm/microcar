# B3: gateway reboot with nonzero downtime — Stage A3 restart verification.
#
# Directly asserts:
#  - machine_reset_boot marker appears after downtime
#  - legacy fault:reboot marker does NOT appear
#  - gateway emits node_online after reconstruction
#  - no gateway node_lost / gateway_timeout marker appears
#
# Covered by sim-world unit tests:
#  - pending_boots advances run()/run_until()
#  - frame before boot is dropped
#  - frame exactly at boot is delivered
#  - restart preserves persistent state, resets volatile state
#
# TODO:
#  - plant-backed restart scenario once plant segfault is fixed
#  - explicit RTOS/config identity assertion
#  - explicit firmware-factory invocation assertion
#
# NOTE: [plant] removed due to pre-existing C firmware segfault with
# the microcar plant model.  This scenario exercises the core restart
# infrastructure (pending_boots, deferred reconstruction, firmware
# factory, delivery boundary) without the plant.

name = "b3_gateway_reboot_downtime"
duration_ms = 2000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

# ── Gateway reboot at 1000ms with 5ms downtime → boot at ~1005ms ──
[[fault]]
at_ms = 1000
target = "machine.gateway"
type = "reboot"
downtime_ms = 5

# ── Assertions ──

# machine_reset_boot fires on the reconstructed gateway.
[[expect.event]]
before_ms = 1200
machine = "gateway"
event = "machine_reset_boot"

# The legacy fault:reboot marker MUST NOT appear.
[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "fault:reboot"

# Gateway heartbeat resumes after boot (node_online emitted post-reconstruction).
[[expect.event]]
before_ms = 2000
machine = "gateway"
event = "node_online"

# Gateway does not emit node_lost or gateway_timeout markers after restart.
# This is a limited no-plant smoke assertion — the check is on the gateway
# machine itself, not on the sibling ECU.  The powertrain continues to run,
# but this scenario does not directly assert powertrain/sibling heartbeat
# continuity.
#
# TODO: add explicit powertrain heartbeat-continuity assertion (expect.no
# on machine = "powertrain" for node_lost / gateway_timeout) once the
# harness exposes/records the relevant sibling ECU heartbeat markers.
[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "node_lost"

[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "gateway_timeout"
