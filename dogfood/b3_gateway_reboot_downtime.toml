# B3 / R4: gateway reboot with nonzero downtime — firmware recovery proof.
#
# Asserts real restart semantics (not reset markers alone):
#  - machine_reset_begin / machine_reset_boot around the downtime boundary
#  - gateway firmware factory re-runs boot (microcar_boot_gateway, primitives)
#  - legacy fault:reboot marker does NOT appear
#  - no gateway node_lost / gateway_timeout
#  - sibling powertrain does not observe gateway_timeout across the 5 ms downtime
#
# Flash persistence, RTOS/config identity, volatile-queue reset, and 100×
# determinism are covered by tests/gateway_reboot_downtime.rs.

name = "b3_gateway_reboot_downtime"
duration_ms = 2000

[[machine]]
id = 1
name = "gateway"
firmware = "firmware/gateway_ecu"
rtos = "freertos"

[[machine]]
id = 2
name = "powertrain"
firmware = "firmware/powertrain_ecu"
rtos = "freertos"

[[bus]]
name = "vcan0"
type = "can"
latency_us = 500

[[bus.node]]
bus = "vcan0"
machine = "gateway"

[[bus.node]]
bus = "vcan0"
machine = "powertrain"

# ── Gateway reboot at 1000ms with 5ms downtime → boot at ~1005ms ──
[[fault]]
at_ms = 1000
target = "machine.gateway"
type = "reboot"
downtime_ms = 5

# ── Assertions ──

[[expect.event]]
before_ms = 1200
machine = "gateway"
event = "machine_reset_begin"

[[expect.event]]
before_ms = 1200
machine = "gateway"
event = "machine_reset_boot"

# Post-reconstruction firmware boot (factory path). Pre-reset machine traces
# are discarded with the old GuestRuntime; these markers prove the factory
# reattached firmware and re-ran init after machine_reset_boot.
[[expect.event]]
before_ms = 2000
machine = "gateway"
event = "microcar_boot_gateway"

[[expect.event]]
before_ms = 2000
machine = "gateway"
event = "gateway_mutex"

[[expect.event]]
before_ms = 2000
machine = "gateway"
event = "gateway_queue"

# The legacy fault:reboot marker MUST NOT appear.
[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "fault:reboot"

[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "node_lost"

[[expect.no]]
before_ms = 2000
machine = "gateway"
event = "gateway_timeout"

# Sibling powertrain heartbeat path stays healthy across the short downtime.
[[expect.no]]
before_ms = 2000
machine = "powertrain"
event = "gateway_timeout"
